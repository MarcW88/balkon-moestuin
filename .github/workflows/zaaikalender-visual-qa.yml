name: Zaaikalender visual QA
on:
  push:
    branches:
      - editorial/shared-workflow-other-pages-20261028
    paths:
      - 'zaaikalender/**'
      - 'style.css'
      - '.github/qa/zaaikalender-visual.cjs'
      - '.github/workflows/zaaikalender-visual-qa.yml'
  workflow_dispatch:
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/zaaikalender-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/zaaikalender/ >/dev/null && break; sleep 1; done
      - name: Audit 13 pages at mobile and desktop widths
        run: node .github/qa/zaaikalender-visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zaaikalender-playwright-visual-results
          path: artifacts/zaaikalender/
          if-no-files-found: warn
