name: QA UX shell all pages
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'index.html'
      - 'style.css'
      - '.qa/design-shell-global.cjs'
      - '.github/workflows/qa-design-shell-global.yml'
  workflow_dispatch:
jobs:
  global-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
      - name: Check all HTML pages desktop and mobile
        run: node .qa/design-shell-global.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-shell-global-captures
          path: qa-shell-global-artifacts/
          if-no-files-found: warn
