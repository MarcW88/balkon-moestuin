name: QA Fruit hub Chromium
on:
  pull_request:
    paths:
      - 'fruit-kweken/index.html'
      - '.qa/fruit-hub-playwright.cjs'
      - '.github/workflows/qa-fruit-hub.yml'
  workflow_dispatch:
jobs:
  rendered-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
      - name: Run fruit hub desktop/mobile QA
        run: node .qa/fruit-hub-playwright.cjs
      - name: Upload QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fruit-hub-qa-desktop-mobile
          path: qa-fruit-artifacts/
          if-no-files-found: warn
