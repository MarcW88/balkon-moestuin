name: QA UX shell pilot Chromium
on:
  pull_request:
    paths:
      - 'style.css'
      - 'index.html'
      - 'groenten-kweken/index.html'
      - 'groenten-kweken/tomaten-kweken-in-pot/index.html'
      - '.qa/design-shell-playwright.cjs'
      - '.github/workflows/qa-design-shell.yml'
  workflow_dispatch:
jobs:
  rendered-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
      - name: Run desktop, tablet and mobile shell QA
        run: node .qa/design-shell-playwright.cjs
      - name: Upload QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-shell-qa-captures
          path: qa-design-shell-artifacts/
          if-no-files-found: warn
