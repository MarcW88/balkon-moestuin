name: QA long guide pilot
on:
  pull_request:
    paths:
      - 'style.css'
      - 'groenten-kweken/tomaten-kweken-in-pot/index.html'
      - '.qa/long-guide-playwright.cjs'
      - '.github/workflows/qa-long-guide.yml'
  workflow_dispatch:
jobs:
  rendered-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
      - run: node .qa/long-guide-playwright.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-guide-pilot-screenshots
          path: qa-long-guide-artifacts/
